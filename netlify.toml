# Netlify Configuration for Next.js App Router
# Netlify automatically configures its OpenNext runtime adapter.
# Do not override publish directory or add legacy plugins.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_ENV,ADMIN_EMAIL,CLOUDINARY_CLOUD_NAME"
